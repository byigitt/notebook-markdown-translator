[project]
name = "notebook-markdown-translator"
version = "0.1.0"
description = "A tool to extract, translate, and reapply markdown content in Jupyter notebooks"
requires-python = ">=3.9"
dependencies = [
    "nbformat>=5.9.2",
    "pydantic>=2.6.1",
    "typer>=0.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "mypy>=1.8.0",
    "ruff>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook_translator"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.scripts]
notebook-translator = "notebook_translator.cli:main" 